[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gazeEmotion"
version = "0.1.0"
description = "Gaze-emotion modeling utilities"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "opencv-python",
    "torch",
    "torchvision",
    "tqdm",
    "pyyaml"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "models*"]